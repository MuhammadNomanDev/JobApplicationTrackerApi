name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore JobApplicationTrackerAPI.sln

    - name: Build
      run: dotnet build JobApplicationTrackerAPI.sln -c ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Run Unit Tests
      run: dotnet test tests/JobApplicationTrackerAPI.UnitTests/JobApplicationTrackerAPI.UnitTests.csproj -c ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger trx --results-directory test-results

    - name: Run Integration Tests
      run: dotnet test tests/JobApplicationTrackerAPI.IntegrationTests/JobApplicationTrackerAPI.IntegrationTests.csproj -c ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger trx --results-directory test-results
      env:
        # Test-only JWT config. Program.cs reads Jwt:Key/Issuer/Audience at startup,
        # and CI has no user-secrets, so we provide dummy values here. This key signs
        # test tokens only and is never used in production.
        Jwt__Key: "P0-Test-Only-Jwt-Signing-Key-0123456789abcdef"
        Jwt__Issuer: "JobApplicationTracker.Tests"
        Jwt__Audience: "JobApplicationTracker.Tests"

    - name: Verify formatting
      run: dotnet format whitespace --verify-no-changes JobApplicationTrackerAPI.sln

    - name: Check coverage gate
      run: python3 scripts/coverage-gate.py

    - name: Publish Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/

    - name: Publish API
      run: dotnet publish src/JobApplicationTrackerAPI.Api/JobApplicationTrackerAPI.Api.csproj -c ${{ env.BUILD_CONFIGURATION }} -o publish/

    - name: Upload published artifact
      uses: actions/upload-artifact@v4
      with:
        name: api-publish
        path: publish/

  docker:
    name: Build & Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/muhammadnomandev/job-application-tracker-api:latest
          ghcr.io/muhammadnomandev/job-application-tracker-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # required for OIDC
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy container image to Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: jobtracker-noman-dev-api-akbudaaudcheefgd
        images: ghcr.io/muhammadnomandev/job-application-tracker-api:latest
