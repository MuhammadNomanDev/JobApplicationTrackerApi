# P1/M2: Deploy job replacement (OIDC, no long-lived secrets).
# Noman: replace the existing "Deploy to Azure" job in .github/workflows/ci-cd.yml
# with the job below (via GitHub web UI — the App cannot edit workflows).
#
# Prerequisites (one-time, see docs/learning/p1m2.md):
#   1. `infra/main.bicep` deployed (resource group rg-jobtracker, UK South).
#   2. Microsoft Entra app with a federated credential trusting this repo's
#      main branch (OIDC). No AZURE_CREDENTIALS secret needed.
#   3. These GitHub Actions secrets set (Settings → Secrets and variables → Actions):
#        AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   4. App settings configured on the Web App (connection strings, Jwt__Key, etc.).
#
# What it does on every push to main (after the docker job):
#   1. Logs in to Azure via OIDC (azure/login@v2, no stored secret).
#   2. Restarts the Web App so it pulls the new GHCR image.

  deploy:
    name: Deploy to Azure
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # required for OIDC
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy container image to Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: jobtracker-api
        images: ghcr.io/muhammadnomandev/job-application-tracker-api:latest
